
name: Create Cartoon Short

on:
  workflow_dispatch:
  push:
    paths:
      - "render.py"
      - ".github/workflows/render.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install drawing library
        run: pip install Pillow

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render the cartoon
        run: python render.py

      - name: Save the finished video
        uses: actions/upload-artifact@v4
        with:
          name: tiny-trouble-short
          path: tiny_trouble_short.mp4
          retention-days: 3
